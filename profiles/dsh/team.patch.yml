# Native DSH Agent Teams — shipped overlay (profiles/dsh/team.patch.yml).
#
# `@deepseek-ai/dsh-experimental-agent-team` ships no tools of its own: the
# README's smallest working setup requires it together with
# `@deepseek-ai/dsh-experimental-tool-agent-team`, so the two rows always travel
# as a pair.
#
# Durable session storage is a prerequisite and is ALREADY mounted by
# @deepseek-ai/dsh-base (id: session-persistence-jsonl), so it is deliberately
# not inserted again here.
#
# This file exists as its own overlay because profiles/dsh/taskhive.patch.yml is
# regenerated by main.js writeDshPatch() on every launch, so hand edits there are
# overwritten. DSH's --patch is repeatable: the harness passes taskhive.patch.yml
# first and this file second, only when it exists.
#
# Optional limits (defaults shown) may be added to the agent-team row as config:
#   maxMembers: 16
#   maxTasks: 256
#   maxPendingMessagesPerMember: 64
#   maxMessageBytes: 65536
#   disposalTimeoutMs: 5000
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
